[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsait4000-quantum-lake-student"
version = "0.2.0"
description = "Student starter for the DSAIT4000 QEC data-lake and AI/ML assignment"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.3.2",
  "minio==7.2.15",
  "pandas==2.3.1",
  "psycopg[binary]==3.2.9",
  "pyarrow==20.0.0",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
  "rich==14.0.0",
  "scikit-learn==1.9.0",
  "SQLAlchemy==2.0.41",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
quantum-lake = "quantum_lake_student.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_lake_student"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
